  --bg-0:#0c0e12; --bg-1:#0b0d11; --bg-side:#0f1218; --bg-top:#101319;

  --tx-9:#7b8494; --tx-10:#6d7584; --tx-11:#5f6878; --tx-12:#5a6272;
  --tx-13:#4e5665; --tx-14:#4b5361; --tx-15:#3f4857;
  --accent:#f08a5d; --accent-deep:#e0603c; --accent-deep2:#e2703f;
  --accent-tx:#f4a97f; --accent-tx2:#f0a27a; --accent-tx3:#f0c4a8;
  --ok:#54d29b; --ok-2:#59d6a1; --ok-3:#4fd39b; --ok-4:#3ecf8e;
  --ok-tx:#8fd4b4; --ok-tx2:#8fe0bb; --ok-code:#9fd6b4;
  --err:#ef7e89; --err-2:#f0818c; --err-3:#f1919b; --err-strong:#e24b4a; --err-strong2:#e11d48;
  --info:#7db8e8; --info-2:#5aa9e6; --info-3:#8fb4d8;
  --warn:#eab06a; --warn-2:#f0c07a; --warn-3:#f0a45d;
  --purple:#b49af5; --purple-2:#a78bfa; --teal:#4fc9c9;
  --mask:rgba(5,7,10,.74); --shadow-1:rgba(0,0,0,.55); --shadow-2:rgba(0,0,0,.4);
}
body.light{
  --bg-0:#eef1f5; --bg-1:#f7f8fa; --bg-side:#f8f9fb; --bg-top:#ffffff;
  --bg-panel:#fafbfc; --bg-inset:#f4f6f9; --bg-scr:#f7f9fb; --bg-card:#ffffff;
  --bg-modal:#ffffff; --bg-editor:#ffffff; --bg-code:#f8f9fb; --bg-skip:#f4f6f9;
  --bg-note:#f3f6fa; --bg-tabsel:#f1f4f9; --bg-wbox:#f1f4f8; --bg-chip:#f1f3f7;
  --bg-btn:#ffffff; --bg-el:#eef2f8; --bg-hover:#eceff4; --bg-hover2:#eef1f6;
  --bg-hover3:#eef1f6; --bg-btnh:#f3f5f9; --bg-th:#f1f4f9; --bg-inline:#f0f3f8;
  --bg-sel:#fff3ec; --bg-accent-soft:#fff1e8; --bg-accent-soft2:#fff4ec;
  --bg-ok-soft:#eefaf4; --bg-ok-soft2:#eefaf4; --bg-err-soft:#fdf1f3; --bg-err-soft2:#fdf1f3;
  --bg-warn-soft:#fdf6e9; --bg-purple-soft:#f6f2fe; --bg-purple-soft2:#f6f2fe;
  --bg-add:#eaf7f0; --bg-del:#fdeef0;
  --bg-gray:#f2f4f8; --bg-hover6:#f4f6fa; --bg-avatar:#e6eaf2; --line-avatar:#d3dae5;
  --bg-ok-soft3:#e9f8f1; --line-ok3:#bfe6d3; --line-warn2:#ecd9b4; --bg-warn-soft2:#fdf9f0;
  --bg-err-soft3:#fdeef0; --line-err3:#f2c8cd; --bg-info-soft:#ecf4fb; --line-info:#c9def2;
  --bg-btnh2:#eef1f6; --bg-ok-soft4:#e8f7ef; --bg-wire:#dfe6f0; --bg-wire2:#fdeee2;
  --line-spin:#c8d0dc; --bg-chip2:#f1f3f7;
  --bg-k-wf:#e8f1fa; --bg-k-state:#f2edfc; --bg-k-pub:#fdf3e8; --bg-k-bind:#e9f8f1; --bg-k-actor:#e8f7f7; --bg-k-conf:#eef3fa;
  --bg-purple-soft3:#f7f3fe; --line-purple2:#e6dcf8; --anno-bg:#5b43a8; --anno-tx:#ffffff;
  --line-0:#e8ecf2; --line-1:#e5e9f0; --line-a:#e2e7ef; --line-b:#e6eaf1;
  --line-c:#e2e7ef; --line-d:#edf0f5; --line-e:#f0f3f7; --line-f:#e8ecf2;
  --line-g:#dde3ec; --line-h:#dfe4ec; --line-i:#e0e5ee; --line-j:#e4e8ef;
  --line-purple:#e3d9f7; --line-hover:#c9d2df; --line-tst:#dfe5ee;
  --line-scr:#e4e8ef; --line-pnode:#e4e8ef; --line-wbox:#e5e9f0;
  --line-ok:#cbe9da; --line-ok2:#cbe9da; --line-err:#f3cdd2; --line-err2:#f3cdd2;
  --line-warn:#f0e0bf; --line-accent:#f6cdb4; --line-chiphover:#c6cfdc; --line-dash:#eef1f6;
  --tx-0:#11151c; --tx-1:#0f1319; --tx-1b:#12161d; --tx-2:#1d222b; --tx-2b:#1f242c;
  --tx-2c:#2b3240; --tx-2d:#2b3240; --tx-3:#2c3340; --tx-4:#3c4552; --tx-5:#4a5361;
  --tx-6:#5b6472; --tx-6b:#5f6878; --tx-7:#6b7482; --tx-8:#7a8494; --tx-8b:#7d8794;
  --tx-9:#7d8695; --tx-10:#787f8d; --tx-11:#878f9c; --tx-12:#8f97a4;
  --tx-13:#98a0ac; --tx-14:#8a93a1; --tx-15:#b3bac6;
  --accent:#e2632a; --accent-deep:#d4551f; --accent-deep2:#d95b25;
  --accent-tx:#c2511a; --accent-tx2:#b8501c; --accent-tx3:#8f3f16;
  --ok:#12855a; --ok-2:#127d55; --ok-3:#0f8a5c; --ok-4:#12a06a;
  --ok-tx:#0f7a52; --ok-tx2:#0d7a50; --ok-code:#0f7a52;
  --err:#cf3b4c; --err-2:#c93546; --err-3:#c93546; --err-strong:#d92d3f; --err-strong2:#d92d3f;
  --info:#1f6cb0; --info-2:#1a629f; --info-3:#2b6b95;
  --warn:#a0721a; --warn-2:#96661a; --warn-3:#a86a1f;
  --purple:#6b45c4; --purple-2:#6b45c4; --teal:#0d7a7a;
  --mask:rgba(15,20,30,.35); --shadow-1:rgba(15,23,35,.16); --shadow-2:rgba(15,23,35,.12);
}
/* 浅色下橙色底改白字，避免深棕字发脏 */
body.light .btn.primary,body.light .mod.active,body.light .rolebtn.on,body.light .rolebtn.x.on{color:#fff}
/* 主题切换按钮 */
.thbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-h);background:var(--bg-btn);color:var(--tx-6);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.thbtn:hover{color:var(--accent);border-color:var(--accent)}
body.light .i-sun{display:none}
body:not(.light) .i-moon{display:none}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-0);color:var(--tx-0);font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}
code,.mono{font-family:"SF Mono",Menlo,Consolas,monospace}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-h);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* topbar */
.topbar{height:52px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--bg-top);border-bottom:1px solid var(--line-0);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.brand .logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800}
.brand small{font-weight:500;font-size:11.5px;color:var(--tx-9);margin-left:6px}
.mods{display:flex;align-items:center;gap:2px;background:var(--bg-chip);padding:3px;border-radius:9px;border:1px solid var(--line-a)}
.mod{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;border:0;background:transparent;color:var(--tx-6b);font-size:12.5px;cursor:pointer}
.mod:hover{color:var(--tx-2c);background:var(--bg-hover)}
.mod.active{background:var(--accent);color:#1a1207;font-weight:600}
.mod.lock{color:var(--tx-12);cursor:not-allowed}
.mod.lock:hover{background:var(--bg-gray);color:var(--tx-9)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;border:1px solid var(--line-h);background:var(--line-dash);color:var(--tx-2d);font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--bg-btnh);border-color:var(--line-hover);color:#fff}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep2));border-color:var(--accent-deep2);color:#1a1207;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:11.5px;border-radius:6px}
.btn.danger{border-color:var(--line-err);color:var(--err-2);background:var(--bg-err-soft2)}
.btn.ok{border-color:var(--line-ok2);color:var(--ok-2);background:var(--bg-ok-soft2)}
.btn.ghost{background:transparent}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--bg-avatar);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx-2c);border:1px solid var(--line-avatar)}

/* layout */
.body{display:flex;height:calc(100vh - 52px)}
.sidebar{width:242px;flex:0 0 242px;background:var(--bg-side);border-right:1px solid var(--line-1);overflow:auto;padding:10px 8px}
.stage{flex:1;overflow:auto;padding:16px 20px 60px;min-width:0}
.rpane{width:330px;flex:0 0 330px;background:var(--bg-1);border-left:1px solid var(--line-1);display:flex;flex-direction:column}
.rpane.hide{width:0;flex-basis:0;overflow:hidden;border-left:0}

/* sidebar tree */
.sb-group{font-size:10px;color:var(--tx-12);letter-spacing:.9px;margin:12px 8px 5px;text-transform:uppercase}
.trow{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;color:var(--tx-5);cursor:pointer;font-size:12.5px;position:relative}
.trow:hover{background:var(--bg-hover2);color:var(--tx-2)}
.trow.on{background:var(--bg-sel);color:var(--accent-tx)}
.trow.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.trow.sub{padding-left:22px;font-size:12px}
.trow.sub2{padding-left:38px;font-size:11.5px;color:var(--tx-6b)}
.trow.sub2.on{color:var(--accent-tx)}
.trow .cnt{margin-left:auto;font-size:10px;color:var(--tx-12);font-family:"SF Mono",Menlo,monospace}
.trow.lock{color:var(--tx-13);cursor:not-allowed}
.trow.lock:hover{background:transparent;color:var(--tx-13)}
.badge{margin-left:auto;background:var(--accent-deep);color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;font-weight:600}

/* generic */
.ph{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.ph h1{font-size:17px;margin:0;font-weight:650}
.ph .sub{font-size:11.5px;color:var(--tx-8);margin-top:3px;line-height:1.6}
.card{background:var(--bg-card);border:1px solid var(--line-c);border-radius:10px;padding:12px 14px;margin-bottom:11px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ch h3{font-size:12.5px;margin:0;font-weight:600;color:var(--tx-2b)}
.sub{color:var(--tx-8)}
.small{font-size:11.5px}
.muted{color:var(--tx-7)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1.5px 7px;border-radius:5px;background:var(--bg-gray);color:var(--tx-6);border:1px solid var(--line-g);white-space:nowrap}
.t-ok{background:var(--bg-ok-soft3);color:var(--ok);border-color:var(--line-ok3)}
.t-warn{background:var(--bg-warn-soft);color:var(--warn);border-color:var(--line-warn2)}
.t-err{background:var(--bg-err-soft3);color:var(--err);border-color:var(--line-err3)}
.t-info{background:var(--bg-info-soft);color:var(--info);border-color:var(--line-info)}
.t-gray{background:var(--bg-gray);color:var(--tx-8);border-color:var(--line-g)}
.t-accent{background:var(--bg-accent-soft2);color:var(--accent-tx2);border-color:var(--line-accent)}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
hr.sep{border:0;border-top:1px solid var(--line-f);margin:10px 0}
.empty{padding:26px;text-align:center;color:var(--tx-11);font-size:12.5px}
table.tb{width:100%;border-collapse:collapse;font-size:11.5px}
table.tb th{text-align:left;color:var(--tx-10);font-weight:500;padding:6px 7px;border-bottom:1px solid var(--line-a);font-size:10.5px;white-space:nowrap}
table.tb td{padding:7px;border-bottom:1px solid var(--line-e);color:var(--tx-4);vertical-align:middle}
table.tb tr:hover td{background:var(--bg-hover6)}

/* workspace bar */
.ws{border:1px solid var(--line-warn2);background:var(--bg-warn-soft2);border-radius:10px;padding:11px 13px;margin-bottom:11px}
.ws.clean{border-color:var(--line-ok3);background:var(--bg-ok-soft)}
.ws-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--warn);margin-bottom:6px}
.ws.clean .ws-h{color:var(--ok)}
.ws-item{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 0;color:var(--tx-4)}
.ws-item .st{color:var(--err)}

/* commit list */
.clist{max-height:none}
.citem{padding:9px 10px;border-radius:8px;border:1px solid var(--bg-btnh2);cursor:pointer;margin-bottom:7px;background:var(--bg-panel);transition:.14s}
.citem:hover{border-color:var(--line-hover)}
.citem.on{border-color:var(--accent);background:var(--bg-accent-soft)}
.citem .top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.citem .no{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--accent-tx2);font-weight:600}
.citem .msg{font-size:11.5px;color:var(--tx-4);line-height:1.5}
.citem .foot{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10.5px;color:var(--tx-11)}
.tagname{font-size:10px;padding:0 5px;border-radius:4px;background:var(--bg-ok-soft4);color:var(--ok);border:1px solid var(--line-ok2);font-family:"SF Mono",Menlo,monospace}

/* tree view */
.tree-box{background:var(--bg-code);border:1px solid var(--line-f);border-radius:8px;padding:9px 11px;font-family:"SF Mono",Menlo,monospace;font-size:11px;line-height:1.9}
.tree-line{display:flex;align-items:center;gap:6px}
.tree-line .k{color:var(--info);width:62px;flex:0 0 auto}
.tree-line .v{color:var(--tx-2)}
.tree-line .df{color:var(--tx-11);font-size:10.5px}
.ck{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11.5px}
.ck .dot{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* proto canvas */
.frame{position:relative;background:var(--bg-code);border:1px solid var(--line-c);border-radius:10px;padding:12px;user-select:none}
.frame.anno{cursor:crosshair;border-color:var(--purple-2)}
.screens{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scr{background:var(--bg-scr);border:1px solid var(--line-scr);border-radius:8px;padding:9px;min-height:196px}
.scr .cap{font-size:10.5px;color:var(--tx-10);margin-bottom:7px}
.wb{height:7px;border-radius:3px;background:var(--bg-el);margin-bottom:5px}
.wb.h{height:10px;background:var(--bg-wire);width:62%}
.wb.a{background:var(--bg-wire2);width:44%}
.wbox{height:52px;border-radius:6px;background:var(--bg-wbox);border:1px dashed var(--line-wbox);margin-bottom:5px}
.ar{position:absolute;border:1.5px solid var(--purple-2);background:rgba(167,139,250,.14);border-radius:3px;pointer-events:none}
.anno-item{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line-e);font-size:11.5px}
.anno-idx{width:18px;height:18px;border-radius:5px;background:var(--bg-purple-soft2);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto}

/* pipeline */
.pipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.pnode{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;border:1px solid var(--line-pnode);background:var(--bg-inset);font-size:11.5px;color:var(--tx-7)}
.pnode.done{border-color:var(--line-ok);background:var(--bg-ok-soft);color:var(--ok-tx)}
.pnode.run{border-color:var(--accent);background:var(--bg-accent-soft);color:var(--accent-tx)}
.pnode .ar{position:static;border:0;background:none;width:auto;height:auto;color:var(--tx-15)}


/* plan tabs */
.ptabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line-1);margin-bottom:11px}
.ptab{display:flex;align-items:center;gap:5px;padding:7px 12px;font-size:12.5px;color:var(--tx-7);cursor:pointer;border-bottom:2px solid transparent}
.ptab:hover{color:var(--tx-2b)}
.ptab.on{color:var(--accent-tx);border-bottom-color:var(--accent)}
.ptab .dot{width:5px;height:5px;border-radius:50%;background:var(--warn)}

/* editor */
.ed{display:flex;border:1px solid var(--line-c);border-radius:10px;overflow:hidden;height:calc(100vh - 340px);min-height:420px;background:var(--bg-card)}
.ed-left{flex:1;display:flex;flex-direction:column;min-width:0}
.ed-bar{display:flex;align-items:center;gap:3px;padding:5px 8px;border-bottom:1px solid var(--line-1);background:var(--bg-panel);flex-wrap:wrap}
.tbtn{min-width:26px;height:24px;padding:0 6px;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--tx-7);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tbtn:hover{background:var(--bg-btnh);color:var(--tx-2b)}
.tbtn.on{background:var(--bg-sel);color:var(--accent-tx);border-color:var(--line-accent)}
.spin{display:inline-block;width:10px;height:10px;border:1.5px solid var(--line-spin);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.sep-v{width:1px;height:15px;background:var(--line-b);margin:0 4px}
.ed-main{flex:1;display:flex;min-height:0}
.ed-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.ed-col textarea{flex:1;width:100%;border:0;border-radius:0;background:var(--bg-editor);padding:14px 16px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.85;resize:none;outline:none;min-height:0;color:var(--tx-2)}
.pv{flex:1;overflow:auto;padding:14px 18px;background:var(--bg-panel);border-left:1px solid var(--line-1);font-size:12.5px;line-height:1.75}
.pv h1{font-size:18px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line-b);color:var(--tx-1)}
.pv h2{font-size:15px;margin:16px 0 7px;color:var(--tx-1b)}
.pv h3{font-size:13.5px;margin:12px 0 5px;color:var(--tx-2c)}
.pv p{margin:6px 0;color:var(--tx-4)}
.pv ul{margin:6px 0;padding-left:18px;color:var(--tx-4)}
.pv li{margin:2px 0}
.pv code{background:var(--bg-inline);padding:1px 4px;border-radius:3px;color:var(--accent-tx2);font-size:11.5px}
.pv pre{background:var(--bg-code);border:1px solid var(--line-f);border-radius:7px;padding:9px 11px;overflow:auto}
.pv pre code{background:none;padding:0;color:var(--ok-code)}
.pv table{border-collapse:collapse;width:100%;margin:8px 0;font-size:11.5px}
.pv th,.pv td{border:1px solid var(--line-b);padding:5px 8px;text-align:left}
.pv th{background:var(--bg-th);color:var(--tx-6)}
.pv blockquote{border-left:2px solid var(--accent);margin:8px 0;padding:2px 10px;color:var(--tx-7)}

/* AI pane */
.ai{width:328px;flex:0 0 328px;border-left:1px solid var(--line-1);background:var(--bg-1);display:flex;flex-direction:column}
.ai-h{padding:8px 11px;border-bottom:1px solid var(--line-d);display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx-3)}
.ai-body{flex:1;overflow:auto;padding:10px}
.ai-msg{border:1px solid var(--line-b);border-radius:8px;padding:7px 9px;font-size:11.5px;margin-bottom:7px;background:var(--bg-inset);color:var(--tx-4);line-height:1.6}
.ai-msg.me{background:var(--bg-accent-soft);border-color:var(--line-accent);color:var(--accent-tx3)}
.ai-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{font-size:10.5px;padding:3px 7px;border-radius:11px;background:var(--bg-chip2);border:1px solid var(--line-g);color:var(--tx-6);cursor:pointer}
.chip:hover{border-color:var(--line-chiphover);color:var(--tx-2b)}
.ai-foot{border-top:1px solid var(--line-d);padding:8px}
.diff{border:1px solid var(--line-i);border-radius:7px;overflow:hidden;margin-top:7px;font-family:"SF Mono",Menlo,monospace;font-size:10.5px;max-height:250px;overflow-y:auto}
.dl{padding:1px 7px;white-space:pre-wrap;word-break:break-word}
.dl.add{background:var(--bg-add);color:var(--ok-tx2)}
.dl.del{background:var(--bg-del);color:var(--err-3)}
.dl.same{color:var(--tx-10)}
.dl.skip{color:var(--tx-15);background:var(--bg-skip);text-align:center;font-size:10px}


/* build workbench */
.bwrap{display:grid;grid-template-columns:172px 1fr 286px;gap:0;border:1px solid var(--line-c);border-radius:10px;overflow:hidden;height:calc(100vh - 300px);min-height:440px;background:var(--bg-card)}
.ftree{display:flex;flex-direction:column;border-right:1px solid var(--line-1);background:var(--bg-panel);min-width:0}
.ftree-h{padding:7px 10px;font-size:10.5px;color:var(--tx-10);border-bottom:1px solid var(--line-d)}
.fitem{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11.5px;color:var(--tx-6);cursor:pointer;border-left:2px solid transparent}
.fitem:hover{background:var(--bg-hover3);color:var(--tx-2b)}
.fitem.on{background:var(--bg-accent-soft);color:var(--accent-tx);border-left-color:var(--accent)}
.fitem .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdot{width:5px;height:5px;border-radius:50%;background:var(--warn);margin-left:auto;flex:0 0 auto}
.ftree-f{margin-top:auto;padding:7px 10px;border-top:1px solid var(--line-d);display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx-11)}
.codepane{display:flex;flex-direction:column;min-width:0}
.codepane textarea{flex:1;width:100%;border:0;border-radius:0;background:var(--bg-editor);padding:12px 14px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;line-height:1.8;resize:none;outline:none;min-height:0;color:var(--tx-2);tab-size:4}
.pipe-col{border-left:1px solid var(--line-1);background:var(--bg-1);padding:9px;overflow:auto}
.step{border:1px solid var(--line-b);border-radius:8px;padding:7px 9px;margin-bottom:6px;background:var(--bg-inset)}
.step-n{font-size:11.5px;color:var(--tx-6)}
.step-s{font-size:10.5px;color:var(--tx-11);margin-top:2px;word-break:break-all}
.step.done{border-color:var(--line-ok);background:var(--bg-ok-soft)}
.step.done .step-n{color:var(--ok-tx)}
.step.stale{border-color:var(--line-err);background:var(--bg-err-soft)}
.step.stale .step-n{color:var(--err)}
.step.doing{border-color:var(--accent);background:var(--bg-accent-soft)}
.step.doing .step-n{color:var(--accent-tx)}


/* visual compare */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vpane{border:1px solid var(--line-c);border-radius:10px;overflow:hidden;background:var(--bg-card)}
.vp-h{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line-d);font-size:11.5px;color:var(--tx-3);background:var(--bg-panel)}
.vscr{padding:12px}
.vtitle{font-size:12.5px;color:var(--tx-1b);margin-bottom:9px}
.vbar{display:flex;gap:6px;margin-bottom:8px;padding:6px;border:1px solid var(--line-b);border-radius:7px;background:var(--bg-inset)}
.vsel{font-size:10.5px;color:var(--tx-7);background:var(--bg-el);border:1px solid var(--line-g);border-radius:4px;padding:2px 7px;white-space:nowrap}
.vtools{display:flex;gap:6px;margin-bottom:9px}
.vpri,.vbtn{font-size:10.5px;padding:3px 9px;border-radius:5px;border:1px solid var(--line-g);background:var(--bg-el);color:var(--tx-6);white-space:nowrap}
.vpri{background:var(--bg-accent-soft2);border-color:var(--line-accent);color:var(--accent-tx2)}
.vtable{width:100%;border-collapse:collapse;font-size:10.5px}
.vtable th{text-align:left;color:var(--tx-10);font-weight:400;padding:4px 6px;border-bottom:1px solid var(--line-b)}
.vtable td{padding:5px 6px;border-bottom:1px solid var(--line-e);color:var(--tx-4)}
.vtag{font-size:9.5px;padding:1px 5px;border-radius:4px;background:var(--bg-warn-soft);color:var(--warn);white-space:nowrap}
.vempty{margin-top:8px;padding:13px;border:1px dashed var(--line-g);border-radius:7px;text-align:center;color:var(--tx-11);font-size:10.5px}
.vpager{margin-top:8px;font-size:10.5px;color:var(--tx-11)}
.vd{position:relative;border:1px dashed var(--err-strong);background:rgba(226,75,74,.1);border-radius:5px;padding:1px}
.vmiss{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--err);border:1px dashed var(--err-strong);background:rgba(226,75,74,.08);border-radius:4px;padding:2px 7px;position:relative;white-space:nowrap}
.vmiss .vdnum{position:static;margin:0}
.vdnum{position:absolute;top:-7px;right:-6px;background:var(--err-strong);color:#fff;font-size:9px;line-height:13px;padding:0 4px;border-radius:7px}


/* embedded preview */
.ifr{width:100%;height:100%;border:0;background:#fff;display:block}
.ifr-lg{width:100%;height:430px;border:1px solid var(--line-b);border-radius:9px;overflow:hidden;background:#fff}
.ifr-sm{width:100%;height:330px;border:1px solid var(--line-b);border-radius:9px;overflow:hidden;background:#fff}
.urlbar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg-panel);border:1px solid var(--line-b);border-bottom:0;border-radius:9px 9px 0 0;font-size:11px;color:var(--tx-7)}
.urlbar .u{font-family:"SF Mono",Menlo,monospace;color:var(--info);background:var(--bg-inset);border:1px solid var(--line-g);border-radius:5px;padding:2px 8px}
.urlbar+.ifr-lg{border-radius:0 0 9px 9px}
.dotok{width:7px;height:7px;border-radius:50%;background:var(--ok-4);box-shadow:0 0 7px var(--ok-4)}


/* collaboration */
.rolebar{display:flex;align-items:center;gap:6px;background:var(--bg-chip);border:1px solid var(--line-a);border-radius:8px;padding:3px}
.rolebtn{padding:5px 9px;border-radius:6px;border:0;background:transparent;color:var(--tx-7);font-size:11.5px;cursor:pointer;white-space:nowrap}
.rolebtn:hover{color:var(--tx-2b);background:var(--bg-hover)}
.rolebtn.on{background:var(--accent);color:#1a1207;font-weight:600}
.rolebtn.x.on{background:var(--purple-2);color:#1a1230}
.home-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-1);margin-bottom:12px}
.home-tab{padding:7px 12px;font-size:12.5px;color:var(--tx-7);cursor:pointer;border-bottom:2px solid transparent}
.home-tab.on{color:var(--accent-tx);border-bottom-color:var(--accent)}
.task{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line-c);border-radius:8px;background:var(--bg-panel);margin-bottom:7px;cursor:pointer}
.task:hover{border-color:var(--line-hover)}
.task .ti{width:22px;height:22px;border-radius:6px;background:var(--bg-el);color:var(--info);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.task .tt{flex:1;min-width:0}
.task .tt b{font-size:12.5px;font-weight:550;color:var(--tx-2b);display:block}
.task .tt span{font-size:10.5px;color:var(--tx-10)}
.task .due{font-size:10.5px;color:var(--tx-7);font-family:"SF Mono",Menlo,monospace}
.todo-done{opacity:.5}
.who{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:10px;background:var(--bg-el);border:1px solid var(--line-j);color:var(--tx-6);font-size:10px}
.who.x{background:var(--bg-purple-soft2);border-color:var(--line-purple);color:var(--purple)}
.perm-note{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px dashed var(--line-i);border-radius:8px;background:var(--bg-note);color:var(--tx-8b);font-size:11.5px;margin-bottom:11px}
.perm-note b{color:var(--tx-2d);font-weight:550}
.md-edit{width:100%;min-height:300px;border:0;border-radius:0;background:var(--bg-editor);color:var(--tx-2);font-family:"SF Mono",Menlo,monospace;font-size:12px;line-height:1.8;padding:14px 16px;resize:vertical;outline:none}


/* change request */
.cr-hero{background:var(--bg-card);border:1px solid var(--line-c);border-radius:10px;padding:13px 15px;margin-bottom:12px}
.cr-hero h2{margin:0 0 3px;font-size:14.5px}
.cr-hero .sub{margin-bottom:10px}
.cr-form{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.cr-form input{flex:1;min-width:220px;background:var(--bg-editor);border:1px solid var(--line-g);border-radius:7px;padding:8px 11px;color:var(--tx-2);font-size:12.5px;outline:none}
.cr-form input:focus{border-color:var(--accent)}
.cr-form select{width:auto;padding:7px 8px;font-size:12px;background:var(--bg-editor);border:1px solid var(--line-g);border-radius:7px;color:var(--tx-2)}
.cr-list{display:flex;flex-direction:column;gap:8px}
.cr-card{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line-c);border-radius:9px;background:var(--bg-card);cursor:pointer}
.cr-card:hover{border-color:var(--line-hover)}
.cr-card .cr-id{font-family:"SF Mono",Menlo,monospace;font-size:10.5px;color:var(--tx-10);width:54px;flex:0 0 auto}
.cr-card .cr-main{flex:1;min-width:0}
.cr-card .cr-main b{display:block;font-size:12.5px;font-weight:550;color:var(--tx-2)}
.cr-card .cr-main span{font-size:10.5px;color:var(--tx-9)}
.cr-state{font-size:10.5px;padding:2px 8px;border-radius:11px;white-space:nowrap}
.cr-state.waiting{background:var(--bg-warn-soft);color:var(--warn);border:1px solid var(--line-warn)}
.cr-state.running{background:var(--bg-info-soft);color:var(--info);border:1px solid var(--line-info)}
.cr-state.published{background:var(--bg-ok-soft3);color:var(--ok);border:1px solid var(--line-ok3)}
.cr-state.draft{background:var(--bg-gray);color:var(--tx-6);border:1px solid var(--line-g)}
.cr-state.paused{background:var(--bg-purple-soft);color:var(--purple);border:1px solid var(--line-purple)}
.cr-state.blocked{background:var(--bg-err-soft3);color:var(--err);border:1px solid var(--line-err3)}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:10px;width:1px;background:var(--line-c)}
.tl-item{position:relative;padding:9px 0 9px 0}
.tl-dot{position:absolute;left:-24px;top:11px;width:15px;height:15px;border-radius:50%;background:var(--bg-el);border:1px solid var(--line-g);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--tx-9)}
.tl-item.done .tl-dot{background:var(--bg-ok-soft3);border-color:var(--line-ok3);color:var(--ok)}
.tl-item.doing .tl-dot{background:var(--bg-accent-soft);border-color:var(--accent);color:var(--accent)}
.tl-item.human .tl-dot{background:var(--bg-warn-soft);border-color:var(--line-warn);color:var(--warn)}
.tl-item.blocked .tl-dot{background:var(--bg-err-soft3);border-color:var(--line-err3);color:var(--err)}
.tl-h{display:flex;align-items:center;gap:8px}
.tl-h b{font-size:12.5px;font-weight:550;color:var(--tx-2)}
.tl-d{font-size:10.5px;color:var(--tx-10);margin-top:2px}
.tl-act{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.gate{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line-warn);background:var(--bg-warn-soft);border-radius:9px;margin-top:11px}
.gate b{font-size:12.5px;color:var(--warn)}

/* runtime pane */
.rp-head{display:flex;border-bottom:1px solid var(--line-d)}
.rp-tab{flex:1;text-align:center;padding:9px 0;font-size:11.5px;color:var(--tx-8);cursor:pointer;border-bottom:2px solid transparent}
.rp-tab.on{color:var(--accent-tx);border-bottom-color:var(--accent);background:var(--bg-tabsel)}
.rp-body{flex:1;overflow:auto;padding:9px 11px}
.rt-who{display:flex;align-items:center;gap:5px;margin:6px 0 1px;padding:3px 6px;border-radius:5px;background:var(--bg-purple-soft);border:1px solid var(--line-purple);color:var(--purple);font-size:10.5px}
.rt-line{display:flex;gap:6px;align-items:flex-start;padding:3px 0;border-bottom:1px dashed var(--line-dash);font-family:"SF Mono",Menlo,monospace;font-size:10.5px;line-height:1.6}
.rt-t{color:var(--tx-14);flex:0 0 auto}
.rt-k{flex:0 0 auto;font-size:9px;padding:0 4px;border-radius:3px;font-weight:700;margin-top:1px}
.k-WF{background:var(--bg-k-wf);color:var(--info-2)}
.k-STATE{background:var(--bg-k-state);color:var(--purple-2)}
.k-PUB{background:var(--bg-k-pub);color:var(--warn-3)}
.k-BIND{background:var(--bg-k-bind);color:var(--ok-3)}
.k-ACTOR{background:var(--bg-k-actor);color:var(--teal)}
.k-OTEL{background:var(--bg-gray);color:var(--tx-8)}
.k-CONF{background:var(--bg-k-conf);color:var(--info-3)}
.rt-x{color:var(--tx-6);word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.impl-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line-dash);font-size:11px}
.impl-row .k{color:var(--tx-10);width:56px;flex:0 0 auto}
.impl-row .v{color:var(--tx-4);word-break:break-word}
.impl-row .v code{color:var(--accent-tx2);background:var(--bg-accent-soft);padding:0 3px;border-radius:3px}

/* modal/toast */
#modal{position:fixed;inset:0;background:var(--mask);display:none;align-items:center;justify-content:center;z-index:60;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{background:var(--bg-modal);border:1px solid var(--line-i);border-radius:13px;padding:18px 20px;width:500px;max-width:92vw;max-height:86vh;overflow:auto;box-shadow:0 24px 60px var(--shadow-1)}
.mbox h2{margin:0 0 5px;font-size:15px}
.mbox .msub{color:var(--tx-8);font-size:11.5px;margin-bottom:12px;line-height:1.7}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--tx-7);margin-bottom:4px}
input,textarea,select{width:100%;background:var(--bg-editor);border:1px solid var(--line-g);border-radius:7px;padding:8px 10px;color:var(--tx-2);font-size:12.5px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:62px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;z-index:80;align-items:center}
.tst{background:var(--bg-el);border:1px solid var(--line-tst);border-radius:8px;padding:8px 14px;font-size:12.5px;color:var(--tx-2);box-shadow:0 10px 30px var(--shadow-2);animation:up .2s}
.tst.ok{border-color:var(--line-ok);color:var(--ok-tx2)}
.tst.warn{border-color:var(--line-warn);color:var(--warn-2)}
.tst.err{border-color:var(--line-err2);color:var(--err-3)}
@keyframes up{from{opacity:0;transform:translateY(7px)}}
.graybanner{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px dashed var(--line-i);border-radius:8px;background:var(--bg-note);color:var(--tx-8b);font-size:11.5px;margin-bottom:12px}

/* ---------- 技术架构 · 四层 ---------- */
.arch{display:flex;flex-direction:column;gap:7px}
.arow{display:grid;grid-template-columns:64px minmax(0,1fr);border:1px solid var(--line-b);border-radius:10px;background:var(--bg-inset);overflow:hidden}
.arow.core{border-color:var(--line-accent);background:var(--bg-accent-soft)}
.arow.rent{border-style:dashed}
.arlv{grid-row:1 / span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;background:var(--bg-panel);border-right:1px solid var(--line-e)}
.arlv .n{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;color:var(--tx-12);letter-spacing:.5px}
.arlv .t{font-size:14px;font-weight:650;color:var(--tx-3);line-height:1}
.arow.core .arlv{background:var(--bg-accent-soft2)}
.arow.core .arlv .t{color:var(--accent-tx)}
.arbody{grid-column:2;padding:8px 10px 3px;min-width:0}
.arbody h4{font-size:12px;font-weight:600;color:var(--tx-2);margin:0 0 5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.own{font-size:9px;font-weight:500;padding:1px 5px;border-radius:4px;border:1px solid var(--line-warn);color:var(--warn)}
.own.self{border-color:var(--line-accent);color:var(--accent-tx2)}
.own.free{border-color:var(--line-i);color:var(--tx-9)}
.achips{display:flex;flex-wrap:wrap;gap:4px}
.achip{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--bg-chip);border:1px solid var(--line-f);color:var(--tx-4);white-space:nowrap}
.achip b{font-weight:600;color:var(--tx-2)}
.amod{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;color:var(--tx-12);line-height:1.5;word-break:break-word;margin-top:5px}

/* ---------- 本地快照：刷新不丢；只在这台浏览器，不跨人 ---------- */
var SNAP_KEY='i3:snap', SNAP_VER=3, _snapT=null, _snapOn=false, _snapAt=null;
function snapState(){
  return {
    ver:SNAP_VER, at:new Date().toISOString(), me:S.me,
    pbc:S.pbcId,
    backlog:BACKLOG, brdVerts:BRD_VERS, brdText:S.brdText||'',
    notifs:(S.notifs||[]).slice(0,20)
  };
}
function saveSnap(){
  if(!_snapOn) return;
  clearTimeout(_snapT);
  _snapT=setTimeout(function(){
    try{ var s=snapState(); _snapAt=s.at; localStorage.setItem(SNAP_KEY, JSON.stringify(s)); }
    catch(e){ /* 隐私模式 / 配额满：静默退回内存态，不打断演示 */ }
  },220);
}
/* 返回 false 表示没有可用快照；返回 {cut:n} 表示恢复了 n 条被刷新掐断的执行 */
function loadSnap(){
  var raw=null;
  try{ raw=localStorage.getItem(SNAP_KEY); }catch(e){ return false; }
  if(!raw) return false;
  var s=null; try{ s=JSON.parse(raw); }catch(e){ return false; }
  if(!s||s.ver!==SNAP_VER){
    try{ localStorage.removeItem(SNAP_KEY); }catch(e){}   /* 结构变了就丢旧数据，绝不猜字段 */
    return false;
  }
  if(!Array.isArray(s.backlog)||!s.backlog.length) return false;
  BACKLOG.length=0; s.backlog.forEach(function(x){ if(x&&x.id) BACKLOG.push(x); });
  if(Array.isArray(s.brdVerts)&&s.brdVerts.length){ BRD_VERS.length=0; s.brdVerts.forEach(function(x){BRD_VERS.push(x);}); }
  if(typeof s.brdText==='string'&&s.brdText) S.brdText=s.brdText;
  if(s.me&&typeof ROLES!=='undefined'&&ROLES[s.me]) S.me=s.me;
  if(Array.isArray(s.notifs)) S.notifs=s.notifs;
  if(s.pbc&&typeof DB!=='undefined'&&DB.pbcs&&DB.pbcs[s.pbc]) S.pbcId=s.pbc;
  _snapAt=s.at||null;
  /* 刷新会掐断正在跑的那一轮：如实标「已介入」，等人点继续，不假装它还在跑 */
  var cut=0;
  BACKLOG.forEach(function(c){
    if(c.state==='running'){
      c.state='paused'; cut++;
      if(c.steps) c.steps.forEach(function(st){ if(st.st==='doing') st.st='todo'; });
    }
  });
  return {restored:true, cut:cut};
}
function snapInfo(){
  var raw=null; try{ raw=localStorage.getItem(SNAP_KEY); }catch(e){ return null; }
  if(!raw) return null;
  var s=null; try{ s=JSON.parse(raw); }catch(e){ return null; }
  return {at:s.at||'', n:(s.backlog||[]).length, kb:Math.round(raw.length/1024)};
}
function resetSnap(ask){
  if(ask!==false && !confirm('清空本机快照，恢复初始演示数据？\n只影响这台浏览器，不涉及任何服务端数据。')) return;
  try{ localStorage.removeItem(SNAP_KEY); }catch(e){}
  location.reload();
}

/* ---------- model helpers ---------- */
function pb(){return DB.pbcs[S.pbcId];}
function latest(t){var a=pb().versions[t];return a[a.length-1];}
function findVer(t,v){return (pb().versions[t]||[]).find(function(x){return x.v===v;});}
function drafts(){
  var out=[];
  ART_ORDER.forEach(function(t){
    var a=pb().versions[t]||[], l=a[a.length-1];
    if(l&&l.st==='draft') out.push({t:t,v:l});
  });
  return out;
}
function addDraft(t,note,md,files){
  var p=pb(), arr=p.versions[t];
  arr.forEach(function(x){ if(x.st==='draft') x.st='superseded'; });
  var cur=arr[arr.length-1];
  var nv='1.0.'+(+cur.v.split('.')[2]+1);
  arr.push({v:nv,at:stamp(),by:wname(t),source:'生成',df:dfRule(t),st:'draft',note:note,md:md||null,files:files||null});
  rt('STATE','put pbc:'+p.id+':artifact:'+t+' '+nv+' {"state":"draft","by":"'+wname(t)+'"}');
  return nv;
}
function staleList(){
  var out=[];
  ART_ORDER.forEach(function(t){
    var l=latest(t);
    if(!l)return;
    var bad=l.df.filter(function(d){var up=latest(d.t);return up&&up.v!==d.v;});
    if(bad.length) out.push({t:t,v:l,on:bad});
  });
  return out;
}
function nextNo(){
  var c=pb().commits; if(!c.length) return '1.0.1';
  var last=c[0].no; var parts=last.split('.'); parts[2]=String(+parts[2]+1); return parts.join('.');
}
function head(){return pb().commits[0];}
function selCommit(){return pb().commits.find(function(c){return c.no===S.selCommit;})||head();}
function isHead(c){return head().no===c.no;}
function nextTag(){
  var tags=pb().commits.filter(function(c){return c.tag;}).map(function(c){return c.tag;});
  if(!tags.length) return 'v1.0.0';
  var n=tags.map(function(t){return +t.replace(/^v/,'').split('.')[2];});
  return 'v1.0.'+(Math.max.apply(null,n)+1);
}

  }

function checkCommit(c){
  var closed=true,miss=[];
  ART_ORDER.forEach(function(t){
    var v=findVer(t,c.tree[t]);
    if(!v){closed=false;miss.push(ART[t].n+' 版本不存在');return;}
    v.df.forEach(function(d){
      if(c.tree[d.t]!==d.v){closed=false;miss.push(ART[t].n+'→'+ART[d.t].n+' '+d.v);}
    });
  });
  var allAcc=ART_ORDER.every(function(t){var v=findVer(t,c.tree[t]);return v&&v.st==='accepted';});
  return [
    {ok:closed,label:'引用闭合',detail:closed?'无悬空引用':miss.slice(0,2).join('，')},
    {ok:allAcc,label:'制品全部 accepted',detail:allAcc?'无草稿':'存在未接受版本'},
    {ok:!!c.digest,label:'镜像与树一致',detail:c.digest?c.digest:'未构建，无 digest'},
    {ok:unhandledFor(c.tree.code)===0,label:'原型还原',detail:unhandledFor(c.tree.code)===0?'无未处理差异':('还有 '+unhandledFor(c.tree.code)+' 处差异未处理')}
  ];
}

function toggleAnno(){S.annoOn=!S.annoOn;S.annoRect=null;refreshAll();}

function bindAnno(){
  var w=el('anno-wrap'); if(!w) return;
  w.addEventListener('pointerdown',function(e){
    if(!S.annoOn) return;
    var r=w.getBoundingClientRect();
    S.annoStart={x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))};
    S.annoRect={x:S.annoStart.x,y:S.annoStart.y,w:0,h:0};
    w.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  w.addEventListener('pointermove',function(e){
    if(!S.annoStart) return;
    var r=w.getBoundingClientRect();
    var x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    var y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
    S.annoRect={x:Math.min(x,S.annoStart.x),y:Math.min(y,S.annoStart.y),w:Math.abs(x-S.annoStart.x),h:Math.abs(y-S.annoStart.y)};
    var d=el('anno-draft');
    if(d){
      d.style.display='block';
      d.style.left='calc('+(S.annoRect.x*100)+'% + 12px)';
      d.style.top='calc('+(S.annoRect.y*100)+'% + 12px)';
      d.style.width='calc('+(S.annoRect.w*100)+'% - 4px)';
      d.style.height='calc('+(S.annoRect.h*100)+'% - 4px)';
    }
  });
  w.addEventListener('pointerup',function(e){
    if(!S.annoStart) return;
    S.annoStart=null;
    if(!S.annoRect||S.annoRect.w<0.02||S.annoRect.h<0.02){S.annoRect=null;renderStage();return;}
    openAnnoModal(S.annoRect);
  });
}

function codeFiles(v){
  var ver=findVer('code',v);
  return (ver&&ver.files)||CODE_SEED;
}
function latestCode(){ return latest('code'); }
function codeState(){
  var lv=latestCode().v;
  if(!S.code||S.code.base!==lv){
    var f=codeFiles(lv);
    S.code={base:lv,path:Object.keys(f)[0],files:JSON.parse(JSON.stringify(f)),dirty:false};
  }
  return S.code;
}
function pickFile(p2){ var c=codeState(); c.path=p2; refreshAll(); }
function onCodeInput(v){ var c=codeState(); c.files[c.path]=v; c.dirty=true; var d=el('code-dirty'); if(d) d.style.display='inline-flex'; }
function fileChanged(p2){ var c=codeState(); var base=codeFiles(c.base); return base[p2]!==c.files[p2]; }

function saveCodeDraft(){
  var c=codeState();
  if(!c.dirty){toast('代码没有改动','warn');return;}
  var nv=addDraft('code','人工修改：'+c.path+' 等',null,JSON.parse(JSON.stringify(c.files)));
  codeState();
  S.code.base=nv; S.code.dirty=false;
  S.bp.log.unshift('['+nowStr()+'] 代码变更为 '+nv+' → 此前的自测 / 镜像 / 部署标记为过期');
  rt('STATE','put pbc:'+pb().id+':artifact:code '+nv+' {"source":"manual-edit"}');
  rt('PUB','publish i3.events → workspace.updated {artifact:"code"}');
  toast('代码已变更 → '+nv+'，此前自测/镜像/部署作废','ok');
  refreshAll();
}

function genCode(){
  if(S.bp.running) return;
  var c=codeState();
  S.bp={running:true,step:1,log:[],tests:null,image:null,deployed:null};
  rt('WF','StartWorkflow i3-codegen instance=codegen-'+Date.now().toString().slice(-5)+' activity=GenerateCode');
  rt('ACTOR','actor X-全栈工程师（开发 worker 型）· 单线程，同 PBC 不并发');
  rt('CONV','Conversation API · 输入 AT 6 条 + Backlog 9 个 task');
  refreshAll();
  var steps=['检出上游制品：AT 1.0.2 · Backlog 1.0.2','生成 internal/billing/service.go','生成 internal/billing/service_test.go','生成 api/openapi.yaml','静态检查 go vet · 0 问题'];
  var i=0;
  function tick(){
    if(i>=steps.length){
      var nv=addDraft('code',wname('code')+' 生成（依据 AT/Backlog）',null,JSON.parse(JSON.stringify(CODE_SEED)));
      codeState(); S.code.base=nv; S.code.dirty=false;
      S.bp.running=false; S.bp.step=2;
      S.bp.log.push('['+nowStr()+'] ✓ 代码就绪 '+nv+'，进工作区');
      rt('STATE','put pbc:'+pb().id+':artifact:code '+nv+' {"state":"draft"}');
      rt('PUB','publish i3.events → code.generated');
      toast('代码已生成 '+nv,'ok'); refreshAll(); return;
    }
    S.bp.log.push('['+nowStr()+'] ['+wname('code')+'] '+steps[i]);
    rt('ACTOR', actorLine('code', steps[i]));
    i++; refreshAll();
    setTimeout(tick,520*SPEED);
  }
  setTimeout(tick,320*SPEED);
}

  var c=codeState();
  if(c.dirty){toast('有未保存的代码，请先保存为草稿（保存即为一次版本变化）','err');return;}
  var unit=testCases(c.files).map(function(x){return {n:x.n,ok:x.ok};});
  var ui=uiChecks(c.files['web/BillList.tsx']||'').map(function(x){return {n:x.n,ok:x.ok,actual:x.actual};});
  var pu=unit.filter(function(x){return x.ok;}).length;
  var pv=ui.filter(function(x){return x.ok;}).length;
  rt('ACTOR', actorLine('at','执行单元测试 '+unit.length+' 条 + UI 还原 '+ui.length+' 项'));
  S.bp.report={forV:latestCode().v, at:stamp(), unit:unit, ui:ui,
    passUnit:pu, totalUnit:unit.length, passUi:pv, totalUi:ui.length,
    pass:pu+pv, total:unit.length+ui.length};
  S.bp.image=null; S.bp.deployed=null;
  rt('WF','activity=TestSuite input=code:'+latestCode().v+' (unit '+unit.length+' + ui '+ui.length+')');
  rt('OTel','span=testsuite pass='+S.bp.report.pass+'/'+S.bp.report.total);
  rt('PUB','publish i3.events → test.finished {pass:'+S.bp.report.pass+'/'+S.bp.report.total+'}');
  var okAll=S.bp.report.pass===S.bp.report.total;
  toast(okAll?'测试全部通过 '+S.bp.report.pass+'/'+S.bp.report.total:('测试不通过 '+(S.bp.report.total-S.bp.report.pass)+' 项失败'),okAll?'ok':'err');
  refreshAll();
}

  {k:'amount', n:'金额格式',   re:/FormatAmountCNY/, expect:'¥1,280.00（千分位 + 两位小数）', actual:'1280（裸数字，无币种无小数）'},
  {k:'status', n:'状态标签',   re:/<StatusTag/, expect:'状态用彩色标签', actual:'—'},
  {k:'empty',  n:'空态提示',   re:/<EmptyState/, expect:'无数据时显示空态与引导', actual:'—'},
  {k:'pager',  n:'分页条',     re:/<Pager/, expect:'表格底部有分页与总数', actual:'—'},
  {k:'search', n:'搜索框',     re:/<SearchBox/, expect:'工具条 · 单号 / 业主搜索', actual:'—'},
  {k:'export', n:'导出按钮',   re:/<ExportBtn/, expect:'工具条 · 导出对账单', actual:'—'}
];
function uiChecks(tsx){
  if(tsx==null) tsx=(codeState().files['web/BillList.tsx']||'');
  return UI_CHECKS.map(function(c){
    var okk=c.re.test(tsx);
    return {k:c.k,n:c.n,ok:okk,expect:c.expect,actual:okk?'与原型一致':c.actual};
  });
}
function visualStats(items){
  var acc=S.visual.accepted||{};
  var total=items.length;
  var accepted=items.filter(function(x){return !x.ok&&acc[x.k];}).length;
  var ok=items.filter(function(x){return x.ok;}).length;
  var base=total-accepted;
  return {total:total, ok:ok, accepted:accepted, pending:total-ok-accepted, rate: base? Math.round(ok/base*100):100};
}
function visualOf(v){
  var ver=findVer('code',v);
  if(!ver||!ver.files) return null;
  var tsx=ver.files['web/BillList.tsx'];
  if(!tsx) return null;
  return uiChecks(tsx);
}
function unhandledFor(v){
  var items=visualOf(v); if(!items) return 0;
  var acc=S.visual.accepted||{};
  return items.filter(function(x){return !x.ok&&!acc[x.k];}).length;
}

function fixDiff(k){
  var c=codeState(), pth='web/BillList.tsx';
  var t=c.files[pth]||'';
  if(k==='batch'){ t=t.replace('        <PeriodFilter />','        <PeriodFilter />\n        <BatchBar />'); }
  if(k==='amount'){ t=t.replace('<td>{r.amount}</td>','<td>{FormatAmountCNY(r.amount)}</td>'); }
  if(k==='filter'){ t=t.replace('<PeriodFilter />','<PeriodFilter period="2026-11" />'); }
  c.files[pth]=t; c.dirty=true;
  rt('ACTOR','actor X-全栈工程师 接收 diff:'+k);
  rt('WF','activity=AutoFix input=diff:'+k+' target=web/BillList.tsx');
  saveCodeDraft();
  (typeof _runTests==='function'?_runTests:runTests)();
  toast(wname('code')+' 已修复「'+k+'」，代码版本 +1，需重新跑测试与构建','ok');
  refreshAll();
}

function deployTag(tag){
  var c=pb().commits.find(function(x){return x.tag===tag;});
  if(!c) return;
  S.deploy={i:0,steps:['拉取镜像','创建 Deployment','等待 Readiness','流量切换'],url:null};
  rt('WF','StartWorkflow i3-deploy instance=dep-'+tag+' target=commit:'+c.no);
  rt('BIND','invoke kubernetes binding → apply prod manifest (image '+c.digest+')');
  refreshAll();
  var i=0;
  function tick(){
    S.deploy.i=i+1; refreshAll();
    i++;
    if(i<S.deploy.steps.length){setTimeout(tick,600*SPEED);}
    else{
      S.deploy.url='https://apps.i3.internal/fee-'+Math.random().toString(16).slice(2,6);
      pb().deploys.push({tag:tag,commit:c.no,url:S.deploy.url,at:stamp(),by:'张昆',status:'success'});
      rt('PUB','publish i3.events → deploy.succeeded {tag:"'+tag+'"}');
      toast('部署成功','ok');
      refreshAll();
    }
  }
  setTimeout(tick,500*SPEED);
}

function mdFor(t,v){
  var ver=findVer(t,v);
  if(ver&&ver.md) return ver.md;
  return (MD_SEED[t]||'# '+ART[t].n).replace('{{V}}',v);
}

function md2html(src){
  var lines=String(src||'').split('\n'), out=[], i=0;
  function inl(s){
    s=esc(s);
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>');
    return s;
  }
  while(i<lines.length){
    var l=lines[i];
    if(/^```/.test(l)){var buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(esc(lines[i]));i++;}i++;out.push('<pre><code>'+buf.join('\n')+'</code></pre>');continue;}
    if(/^\s*$/.test(l)){i++;continue;}
    var hh=/^(#{1,4})\s+(.*)$/.exec(l);
    if(hh){var lv=hh[1].length;out.push('<h'+lv+'>'+inl(hh[2])+'</h'+lv+'>');i++;continue;}
    if(/^\s*[-*]\s+/.test(l)){var its=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){its.push('<li>'+inl(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++;}out.push('<ul>'+its.join('')+'</ul>');continue;}
    if(/^>/.test(l)){var qs=[];while(i<lines.length&&/^>/.test(lines[i])){qs.push(inl(lines[i].replace(/^>\s?/,'')));i++;}out.push('<blockquote>'+qs.join('<br>')+'</blockquote>');continue;}
    if(/^\|/.test(l)){
      var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      var body=rows.filter(function(r){return !/^\|[\s\-:|]+\|?\s*$/.test(r);}).map(function(r){return r.replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim();});});
      var tb='<table>';
      body.forEach(function(c,ri){tb+='<tr>'+c.map(function(x){return (ri===0?'<th>':'<td>')+inl(x)+'</td>';}).join('')+'</tr>';});
      out.push(tb+'</table>');continue;
    }
    out.push('<p>'+inl(l)+'</p>');i++;
  }
  return out.join('');
}

function diffLines(a,b){
  var A=String(a).split('\n'), B=String(b).split('\n');
  var n=A.length,m=B.length,dp=[],i,j;
  for(i=0;i<=n;i++){dp.push(new Array(m+1).fill(0));}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--){dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);}
  var out=[],x=0,y=0;
  while(x<n&&y<m){
    if(A[x]===B[y]){out.push({k:'same',t:A[x]});x++;y++;}
    else if(dp[x+1][y]>=dp[x][y+1]){out.push({k:'del',t:A[x]});x++;}
    else{out.push({k:'add',t:B[y]});y++;}
  }
  while(x<n){out.push({k:'del',t:A[x++]});}
  while(y<m){out.push({k:'add',t:B[y++]});}
  return out;
}

function trimDiff(d,ctx){
  ctx=ctx==null?1:ctx;
  var keep={},out=[];
  d.forEach(function(x,i){ if(x.k!=='same'){ for(var j=Math.max(0,i-ctx);j<=Math.min(d.length-1,i+ctx);j++) keep[j]=1; } });
  var last=-2;
  d.forEach(function(x,i){
    if(keep[i]){ if(i>last+1) out.push({k:'skip',t:'···'}); out.push(x); last=i; }
  });
  return out;
}

function aiRewrite(base,req){
  var ls=base.split('\n');
  if(/精简|压缩|短一点|瘦身/.test(req)){
    var cut=ls.findIndex(function(l){return /^##\s*5\.?\s*非功能|^##\s*非功能/.test(l);});
    var out=cut>0?ls.slice(0,cut):ls;
    out=out.filter(function(l,i){return !(l===''&&out[i-1]==='');});
    return {text:out.join('\n').trim()+'\n',note:'删减了非功能一节并压缩空行，正文结构保持不变（少 '+(ls.length-out.length)+' 行）。'};
  }
  if(/表格/.test(req)){
    var i0=-1;
    for(var i=0;i<ls.length;i++){ if(/^\s*[-*]\s+/.test(ls[i])){i0=i;break;} }
    if(i0>=0){
      var items=[],k=i0;
      while(k<ls.length&&/^\s*[-*]\s+/.test(ls[k])){items.push(ls[k].replace(/^\s*[-*]\s+/,''));k++;}
      var tb=['| 项目 | 说明 |','| --- | --- |'].concat(items.map(function(s){
        var parts=s.split(/：|:/);
        return parts.length>1?('| '+parts[0].trim()+' | '+parts.slice(1).join('：').trim()+' |'):('| '+s.slice(0,8)+' | '+s+' |');
      }));
      var out2=ls.slice(0,i0).concat(tb,ls.slice(k));
      return {text:out2.join('\n'),note:'把 '+items.length+' 条要点转成两列表格，位置不变。'};
    }
    return {text:base+'\n\n| 项目 | 说明 |\n| --- | --- |\n| 待补 | 待补 |\n',note:'文件中没有可转换的要点列表，追加了一个空表格。'};
  }
  if(/验收/.test(req)){
    var blk=['','## 验收标准（BDD）','',
      '| # | Given | When | Then |',
      '| A1 | 用户已登录且有权限 | 进入收费缴费 | 列表按账期倒序，可筛选 |',
      '| A2 | 存在未缴账单 | 点击支付 | 金额正确，支付成功状态即时更新 |',
      '| A3 | 上游文档变更 | 重新生成 | 本制品标记过期并提示重算 |',''];
    return {text:ls.concat(blk).join('\n'),note:'追加了一节 BDD 验收清单（3 条），可直接对应 AT。'};
  }
  if(/扩写|补充背景|细化/.test(req)){
    var add=['','### 补充说明','',
      '现状核查：14 个项目中 9 个已使用线上收费，5 个仍在线下台账；差异主要出现在水电分摊与滞纳金计算。',
      '落地约束：需与现有财务系统对账口径一致，历史数据保留 24 个月。',''];
    return {text:ls.concat(add).join('\n'),note:'在文末补充了现状核查与落地约束两段。'};
  }
  if(/措辞|语气|统一/.test(req)){
    var out3=ls.map(function(l){
      return l.replace(/需要/g,'需').replace(/可以/g,'可').replace(/进行/g,'').replace(/应该/g,'应');
    });
    return {text:out3.join('\n'),note:'统一了措辞（需要→需、可以→可），未改结构与含义。'};
  }
  var extra=['','## 变更记录','','- 变更要求：'+req,'- 影响范围：'+(ART[S.editArt||'prd'].n),'- 待确认：是否同步 AT 与 Backlog',''];
  return {text:ls.concat(extra).join('\n'),note:'追加了变更记录一节，记录了本次修改要求与影响范围。'};
}

function recompute(t){
  var df=dfRule(t);
  var nv=addDraft(t,'按上游最新版本重算');
  rt('ACTOR', actorLine(t, '重算 '+ART[t].n+'（上游已变）'));
  rt('WF','activity=Recompute('+t+') input='+df.map(function(d){return d.t+':'+d.v;}).join(','));
  toast(ART[t].n+' 已重算为 '+nv,'ok');
  refreshAll();
}
function recomputeAll(){
  if(!staleList().length){toast('没有过期制品','warn');return;}
  var pass=0;
  function round(){
    var sl=staleList();
    if(!sl.length||pass>5){
      rt('PUB','publish i3.events → workspace.reconciled');
      toast('过期制品已全部重算','ok');refreshAll();return;
    }
    pass++;
    var i=0;
    function next(){
      if(i>=sl.length){round();return;}
      recompute(sl[i].t); i++;
      setTimeout(next,380*SPEED);
    }
    next();
  }
  round();
}

function doCommit(){
  var sl=staleList();
  if(sl.length){toast('存在过期制品，不能提交','err');return;}
  var ws=drafts();
  if(!ws.length){toast('工作区没有变更','warn');return;}
  var p=pb(), no=nextNo(), base=head().no;
  var changes=ws.map(function(x){ return {t:x.t,from:(head().tree[x.t]||'—'),to:x.v.v}; });
  var tree={};
  ART_ORDER.forEach(function(t){tree[t]=latest(t).v;});
  ws.forEach(function(x){x.v.st='accepted';});

  /* 提交前校验（原子边界） */
  var tmp={no:no,tree:tree,digest:null,changes:changes};
  var closed=ART_ORDER.every(function(t){
    var v=findVer(t,tree[t]); if(!v) return false;
    return v.df.every(function(d){return tree[d.t]===d.v;});
  });
  if(!closed){toast('引用不闭合，拒绝提交（422）','err');return;}

  p.commits.unshift({no:no,type:(S.lastType||'feature'),msg:ws.map(function(x){return ART[x.t].n+' '+x.v.v;}).join(' · '),by:'张昆',
    exec:'X-员工组',at:stamp(),changes:changes,tree:tree,digest:null,tag:null});
  S.selCommit=no;
  rt('STATE','BEGIN → insert commit '+no+' + changes('+changes.length+') → COMMIT');
  rt('PUB','publish i3.events → commit.created {no:"'+no+'"}');
  rt('OTel','span=commit no='+no+' duration=…');
  notify('提交',no+' 已提交：'+changes.length+' 个制品变更');
  toast('已提交 '+no,'ok');
  refreshAll();
}

function doTag(no){
  var c=pb().commits.find(function(x){return x.no===no;}); if(!c) return;
  var box=checkCommit(c);
  var bad=box.filter(function(b){return !b.ok;});
  if(bad.length){toast('三闸未过：'+bad.map(function(b){return b.label;}).join('、'),'err');return;}
  var name=nextTag();
  c.tag=name;
  rt('STATE','insert tag '+name+' (commit='+no+', treeHash='+hashTree(c.tree)+')');
  rt('PUB','publish i3.events → tag.created {name:"'+name+'"}');
  notify('交付',name+' 已指向提交 '+no);
  toast('已打 tag '+name,'ok');
  refreshAll();
}

function myTasks(kind){
  if(kind==='review'){
    /* 等我拍板：到了发布闸的项（不论谁提的，谁看见谁拍） */
    return BACKLOG.filter(function(x){ return x.run==='waiting'; });
  }
  if(kind==='mine'){
    return BACKLOG.filter(function(x){ return x.by===S.me; });
  }
  /* 我的待办：我负责、没完成、也不在等我拍板 */
  return BACKLOG.filter(function(x){
    return x.owner===S.me && x.st!=='done' && x.run!=='waiting' && x.run!=='published';
  });
}

/* =========================================================
   变更单（Change Request）：直通 / 介入
   一条 backlog 进来 → 自动跑全链 → 只停在「是否发布生产」
   任何节点可介入改 PRD/AD/AT/backlog/代码 → 改完自动续跑
   ========================================================= */
function mkSteps(env){
  return [
    {k:'artifacts', n:'生成制品', d:'X 团队按变更类型产出 PRD / 原型 / AD / AT / Backlog', st:'todo'},
    {k:'converge',  n:'收敛过期', d:'按依赖顺序重算，直到工作区干净', st:'todo'},
    {k:'commit',    n:'原子提交', d:'整棵树落一个版本号，全落或全不落', st:'todo'},
    {k:'test',      n:'测试',     d:'单元测试 + UI 还原，全过才放行', st:'todo'},
    {k:'build',     n:'构建镜像', d:'产出 digest 写回提交', st:'todo'},
    {k:'deploy',    n:'部署 '+env, d:'先上非生产环境，跑通再说', st:'todo'},
    {k:'publish',   n:'发布生产', d:'全链唯一需要人拍板的一步', st:'todo', human:true}
  ];
}
/* backlog 项即执行单元；run 状态：idea / running / waiting / paused / blocked / published */
function item(id){ return BACKLOG.find(function(x){return x.id===id;})||null; }
/* 兼容层：执行器原本读写 state，backlog 项用 run 表达同一件事 */
BACKLOG.forEach(function(x){
  if(!Object.getOwnPropertyDescriptor(x,'state')){
    Object.defineProperty(x,'state',{get:function(){return this.run;},set:function(v){this.run=v;}});
  }
});
function curItem(){ return item(S.itemId); }
function ensureSteps(it){ if(!it.steps) it.steps=mkSteps(it.env||'test'); return it.steps; }
function curCR(){ return curItem(); }
function crStateText(st){
  return {idea:'未发起',draft:'未发起',running:'执行中',waiting:'待发布',paused:'已介入',blocked:'受阻',published:'已发布'}[st]||st;
}
function crStateCls(st){ return 'cr-state '+(st==='published'?'published':st==='running'?'running':st==='waiting'?'waiting':st==='paused'?'paused':st==='blocked'?'blocked':'draft'); }

function newItem(title,type,env,mode){
  var n=BACKLOG.filter(function(x){return x.kind==='Story';}).length+1;
  var id='US-'+String(n).padStart(2,'0');
  var it={id:id,t:title,pt:3,st:'todo',owner:'—',kind:'Story',
    pbc:'fee',type:type||'feature',mode:mode||'fast',env:env||'test',run:'idea',
    interventions:[],at:stamp()};
  Object.defineProperty(it,'state',{get:function(){return this.run;},set:function(v){this.run=v;}});
  BACKLOG.push(it);
  return it;
}
/* 人工介入 = 追加一条 backlog（bug / 故事变动 / 技术优化），新项自己走链路 */
function createFix(pid, kind, node){
  var p=item(pid); if(!p) return;
  var n=BACKLOG.filter(function(x){return x.kind==='Story';}).length+1;
  var id='US-'+String(n).padStart(2,'0');
  var pre={bug:'修复：',change:'变更：',opt:'优化：'}[kind]||'追加：';
  var type={bug:'defect',change:'feature',opt:'feature'}[kind]||'feature';
  var it={id:id,t:pre+p.t,pt:2,st:'todo',owner:'—',kind:'Story',pbc:p.pbc||'fee',
    type:type,mode:'fast',env:p.env||'test',run:'idea',parent:p.id,fromNode:node||null,
    interventions:[],at:stamp()};
  Object.defineProperty(it,'state',{get:function(){return this.run;},set:function(v){this.run=v;}});
  BACKLOG.push(it);
  p.run='blocked'; p.blockedBy=id; p.blocked='已提 '+id+'（'+pre.replace('：','')+'）处理';
  rt('STATE','put backlog:'+id+' {"parent":"'+p.id+'","type":"'+type+'"}');
  rt('CONF','item.split {parent:"'+p.id+'",child:"'+id+'",node:"'+(node||'manual')+'"}');
  notify('介入',S.me+' 从 '+p.id+' 提了 '+id+'（'+pre.replace('：','')+'）');
  toast('已提 '+id+'，'+p.id+' 挂起等它完成','ok');
  openItem(id);
  runItem(id);
}
function doneItem(id){
  var c=item(id); if(!c) return;
  c.st='done'; c.run='published';
  rt('STATE','put backlog:'+id+' {"st":"done"}');
  toast(id+' 已完成','ok');
  refreshAll();
}
function rerunItem(id){
  var c=item(id); if(!c) return;
  c.blockedBy=null; c.blocked=null; c.run='idea'; c.step=0;
  if(c.steps) c.steps.forEach(function(x){x.st='todo';x.at=null;});
  runItem(id);
}

function syncReconcile(){
  var guard=0;
  while(staleList().length && guard++<8){
    staleList().slice().forEach(function(x){ recompute(x.t); });
  }
  return staleList().length===0;
}
/* 种子的执行链路初始化：已发布全绿、待发布前六步绿 */
function initBacklogRuns(){
  BACKLOG.forEach(function(it){
    if(it.kind!=='Story'||!it.run||it.run==='idea') return;
    it.steps=mkSteps(it.env||'test');
    var upto=(it.run==='published')?it.steps.length:6;
    it.steps.forEach(function(st,j){
      if(j<upto){ st.st='done'; st.at='11-22 15:18'; }
    });
  });
}

function runItem(id){
  var c=item(id); if(!c) return;
  if(c.state==='running') return;
  ensureSteps(c);
  c.step=0;
  c.steps.forEach(function(x){ if(x.st!=='done') x.st='todo'; });
  S.itemId=id; S.view='item';
  c.state='running'; c.blocked=null;
  S.pbcId=c.pbc||'fee';
  rt('WF','StartWorkflow i3-cr-'+c.id+' mode='+c.mode+' type='+c.type);
  rt('ACTOR','actor X-团队调度 接单 '+c.id+'「'+(c.t||c.title||'')+'」'+(c.mode==='fast'?'（直通：人只在发布前拍板）':'（介入：人可随时改）'));
  launchStep(c,0);
}

function launchStep(c,from){
  if(c.state==='paused'||c.state==='blocked'||c.state==='published') return;
  if(from!=null) c.step=from;
  c.state='running';
  var i=c.step;
  if(i>=c.steps.length){ c.state='waiting'; refreshAll(); return; }
  var st=c.steps[i];
  st.st='doing';
  if(st.human){
    /* 人工闸：不自动执行，直接停在等人拍板 */
    c.state='waiting';
    rt('CONF','cr.waiting_publish {id:"'+c.id+'"}');
    notify('工作项',c.id+' 已到发布闸，等你确认是否发布生产');
    toast(c.id+' 已备好，等你决定是否发布生产','ok');
    refreshAll(); return;
  }
  refreshAll();
  setTimeout(function(){
    var ok=true, why='';
    try{ ok=execStep(c,st) ; }catch(e){ ok=false; why=e.message; }
    if(ok!==true){
      st.st='blocked'; c.state='blocked'; c.blocked=why||'前置条件不满足';
      rt('CONF','cr.blocked {id:"'+c.id+'",step:"'+st.k+'",reason:"'+c.blocked+'"}');
      toast(c.id+' 卡在「'+st.n+'」：'+c.blocked,'err');
      refreshAll(); return;
    }
    st.st='done'; st.at=stamp(); c.step=i+1;
    refreshAll();
    launchStep(c,c.step);
  }, 560*SPEED);
}

/* 变更单由 X 团队执行，用系统身份调用原始动作，不受浏览者角色限制 */
function sysRunTests(){ return (typeof _runTests==='function')?_runTests():runTests(); }
function sysBuildImage(){ return (typeof _buildImage==='function')?_buildImage():buildImage(); }
function sysDeploy(){ return (typeof _deployBuild==='function')?_deployBuild():deployBuild(); }

function execStep(c,st){
  if(st.k==='artifacts'){
    var aff=(TYPE_META[c.type]||TYPE_META.feature).aff.slice();
    aff.forEach(function(t){
      rt('ACTOR', actorLine(t,'领取 '+ART[t].n+'（'+c.id+'）'));
      addDraft(t, (c.t||c.title||'').slice(0,22));
    });
    return true;
  }
  if(st.k==='converge'){
    var okc=syncReconcile();
    rt('PUB','publish i3.events → workspace.reconciled');
    return okc?true:'仍有制品未收敛';
  }
  if(st.k==='commit'){
    var before=head().no;
    if(!drafts().length && staleList().length===0){
      rt('STATE','no-op：工作区无变更，沿用 '+before);
      return true;
    }
    doCommit();
    return head().no!==before ? true : '提交被拒（存在过期制品或引用不闭合）';
  }
  if(st.k==='test'){
    if(S.code && S.code.dirty){ saveCodeDraft(); }
    sysRunTests();
    var r=S.bp.report;
    if(!r) return '测试未产出报告';
    if(r.pass<r.total){
      /* 直通模式：先让 X-全栈工程师按差异自动修一轮，再跑一次 */
      rt('ACTOR','actor X-全栈工程师 按还原差异自动修复');
      var pend=uiChecks(codeState().files['web/BillList.tsx']||'').filter(function(x){return !x.ok;});
      pend.forEach(function(x){ try{ fixDiff(x.k); }catch(e){} });
      sysRunTests();
      r=S.bp.report;
    }
    c.testResult={pass:r.pass,total:r.total,forV:(r.forV||latestCode().v)};
    return (r&&r.pass===r.total) ? true : ('测试 '+r.pass+'/'+r.total+'，有 '+(r.total-r.pass)+' 项失败');
  }
  if(st.k==='build'){
    sysBuildImage();
    return (S.bp.image&&imageFresh())?true:'镜像构建失败（测试未通过或已过期）';
  }
  if(st.k==='deploy'){
    S.envSel=c.env;
    sysDeploy();
    return true;
  }
  if(st.k==='publish'){
    /* 由人显式触发 publishItem()，不会自动到这里 */
    return true;
  }
  return true;
}

/* 介入：暂停 + 跳到该节点对应的操作界面 */
function intervene(id,k){
  var c=item(id); if(!c) return;
  c.state='paused'; c.pausedAt=k;
  S.itemId=id;
  rt('CONF','cr.intervene {id:"'+c.id+'",node:"'+k+'",by:"'+S.me+'"}');
  notify('介入',S.me+' 介入了 '+c.id+' 的「'+k+'」节点');
  toast('已暂停 '+c.id+' → 去改「'+k+'」，改完回来点「继续」','ok');
  if(k==='artifacts'){
    S.pbcId=c.pbc; go('plan'); setPlanTab('edit'); S.editArt='prd';
  } else if(k==='converge'||k==='commit'){
    S.pbcId=c.pbc; go('plan'); setPlanTab('history');
  } else if(k==='test'||k==='build'){
    S.pbcId=c.pbc; go('build'); setBpTab('visual');
  } else if(k==='deploy'){
    S.pbcId=c.pbc; go('build'); setBpTab('preview');
  } else {
    go('item');
  }
  refreshAll();
}
function resumeItem(id){
  var c=item(id); if(!c) return;
  var k=c.pausedAt||c.steps[c.step]&&c.steps[c.step].k;
  c.interventions.push({by:S.me,node:k,note:'介入修改后继续',at:stamp()});
  c.pausedAt=null;
  rt('CONF','cr.resume {id:"'+c.id+'",from:"'+k+'"}');
  /* 从被介入的节点重跑（含该节点及其后） */
  var idx=c.steps.findIndex(function(x){return x.k===k;});
  if(idx<0) idx=c.step;
  c.steps.forEach(function(x,j){ if(j>=idx) x.st='todo'; });
  c.state='running';
  S.view='change'; S.itemId=id;
  launchStep(c,idx);
}

function publishItem(id){
  var c=item(id); if(!c) return;
  if(c.state!=='waiting'){ toast('只有「待发布」的变更单才能发布','warn'); return; }
  c.state='running';
  setRoleSafe('DA');
  S.envSel='prod';
  sysDeploy();
  rt('CONF','cr.publish_prod {id:"'+c.id+'",by:"'+S.me+'"}');
  toast(c.id+' 正在发布到生产…','ok');
  refreshAll();
  setTimeout(function(){
    c.state='published';
    if(c.steps[6]){ c.steps[6].st='done'; c.steps[6].at=stamp(); }
    c.version=head().no;
    c.url=(S.bp.deployed&&S.bp.deployed.url)||'https://prod.i3.internal/fee-'+Math.random().toString(16).slice(2,6);
    c.tag=head().tag||('v1.0.'+tagList().length);
    BACKLOG.forEach(function(x){
      if(x.blockedBy===c.id){
        x.run='idea'; x.blocked=null; x.blockedBy=null;
        notify('依赖解除',c.id+' 已发布，'+x.id+' 可以重新发起');
      }
    });
    notify('发布',c.id+' 已发布生产 · '+c.version);
    rt('PUB','publish i3.events → cr.published {id:"'+c.id+'"}');
    toast(c.id+' 已发布生产','ok');
    refreshAll();
  },1100*SPEED);
}
function setRoleSafe(r){ if(ROLES[r]) S.me=r; }

function rejectItem(id){
  var c=item(id); if(!c) return;
  c.state='draft'; c.step=0;
  c.steps.forEach(function(x){x.st='todo';x.at=null;});
  c.interventions.push({by:S.me,node:'publish',note:'发布被退回，回到草稿',at:stamp()});
  rt('CONF','cr.reject_publish {id:"'+c.id+'"}');
  toast(c.id+' 已退回，可修改后重新发起','ok');
  refreshAll();
}

/* ---------- 变更单视图 ---------- */
function poolComposer(){
  return '<div class="cr-form" style="margin-bottom:9px">'+
      '<input id="cr-title" placeholder="提一条：需求 / 缺陷 / 技术优化，一句话说清要什么" onkeydown="if(event.key===\'Enter\')submitItem()">'+
      '<select id="cr-type">'+Object.keys(TYPE_META).map(function(k){return '<option value="'+k+'">'+TYPE_META[k].n+'</option>';}).join('')+'</select>'+

    '</div>';
}
function submitItem(){

  if(!t){toast('先写一句要做什么','err');return;}
  var type=el('cr-type').value, env=el('cr-env').value;

function openItem(id){ S.itemId=id; S.view='item'; refreshAll(); }

function renderItem(){
  var c=curItem();
  if(!c) return header('工作项','未选择','');
  var h=header(esc(c.id)+' · '+esc(c.t),
    esc(c.kind)+' · 类型 '+esc((TYPE_META[c.type]||{}).n||c.type||'—')+' · 模式 '+(c.mode==='fast'?'直通（人只在发布前拍板）':'介入（可随时改）')+' · 目标 '+esc(c.env||'—'),
    '<button class="btn small" onclick="go(\'projects\')">'+I('list',12)+' 回到需求池</button>');

  /* 人工介入 = 在这里给这条项追加一条 bug / 变动 / 优化，新项自己走链路 */
  if(can('backlog')){
    h+='<div class="row" style="margin-bottom:9px;gap:6px;flex-wrap:wrap">'+
      '<span class="small muted" style="margin-right:2px">人工介入：</span>'+
      '<button class="btn small" onclick="createFix(\''+c.id+'\',\'bug\')">'+I('alert',11)+' 提一条 bug</button>'+
      '<button class="btn small" onclick="createFix(\''+c.id+'\',\'change\')">'+I('edit',11)+' 提一条故事变动</button>'+
      '<button class="btn small" onclick="createFix(\''+c.id+'\',\'opt\')">'+I('cpu',11)+' 提一条技术优化</button>'+
      '<span class="spacer" style="flex:1"></span>'+
      '</div>';
  }
  h+='<div class="card" style="padding:11px 13px"><div class="row">'+
    '<span class="'+crStateCls(c.run)+'">'+crStateText(c.run)+'</span>'+
    '<span class="small muted">'+(c.run==='published'?('已发布 '+esc(c.version||'')+(c.tag?(' · tag '+esc(c.tag)):'')):'')+
      (c.run==='blocked'?('卡在 '+esc(((c.steps||[])[c.step]||{}).n||'')+'：'+esc(c.blocked||'')):'')+
      (c.run==='waiting'?'全链已跑通，就差你一句「发不发」':'')+
      (c.run==='paused'?'已暂停：改完回来点继续':'')+
      (c.run==='running'?'正在跑，可以随时介入':'')+'</span>'+
    '<span class="spacer" style="flex:1"></span>'+
    '<span class="small muted">介入 '+((c.interventions||[]).length)+' 次</span>'+
    (c.testResult?('　·　测试 '+c.testResult.pass+'/'+c.testResult.total+'（基于代码 '+esc(c.testResult.forV)+'）'):'')+'</div></div>';

  if(c.kind==='Task'){
    h+='<div class="card" style="margin-top:4px"><div class="ch">'+I('doc')+'<h3>这类项不跑代码链路</h3></div>'+
      '<div class="small muted">它推进的是制品或配置，不是软件交付。点下面的按钮去对应界面完成，完成后这条自动结束。</div>'+
      '<div class="row" style="margin-top:9px">'+
      (c.go?('<button class="btn small primary" onclick="go(\''+c.go+'\')">去处理</button>'):'')+
      '<button class="btn small" onclick="doneItem(\''+c.id+'\')">标记完成</button></div></div>';
    if((c.interventions||[]).length) h+=renderInterventions(c);
    return h;
  }
  if(!c.steps||c.run==='idea'){
    h+='<div class="row" style="margin-top:10px"><button class="btn primary" onclick="runItem(\''+c.id+'\')">'+I('rocket',12)+' 发起直通</button>'+
      '<span class="small muted">会自动跑完制品→提交→测试→镜像→'+esc(c.env||'test')+'，停在发布前</span></div>';
    if(!c.steps){ if((c.interventions||[]).length) h+=renderInterventions(c); return h; }
  }

  h+='<div class="card"><div class="ch">'+I('git')+'<h3>执行链路</h3><span class="spacer"></span>'+
    '<span class="small muted">任一节点都能在此追加一条</span></div><div class="tl">';
  c.steps.forEach(function(st){
    var cls=st.st==='done'?'done':st.st==='doing'?'doing':st.st==='blocked'?'blocked':(st.human?'human':'');

      (st.st==='done'&&st.at?'<span class="small muted">'+esc(st.at)+'</span>':'')+
      '<span class="spacer" style="flex:1"></span>'+
      (st.st==='done'?'<button class="btn small" onclick="createFix(\''+c.id+'\',\'change\',\''+st.k+'\')">'+I('plus',11)+' 在此提</button>':'')+
      '</div><div class="tl-d">'+esc(st.d)+'</div></div>';
  });
  h+='</div>';

  if(c.run==='waiting'){
    h+='<div class="gate">'+I('alert')+'<b>就差这一步：是否发布生产？</b>'+
      '<span class="small muted">其余全部跑通（制品/提交/测试/镜像/'+esc(c.env||'test')+'）。</span>'+
      '<span class="spacer" style="flex:1"></span>'+
      '<button class="btn small" onclick="rejectItem(\''+c.id+'\')">退回修改</button>'+
      '<button class="btn primary small" onclick="publishItem(\''+c.id+'\')">'+I('rocket',12)+' 发布生产</button></div>';
  }
  if(c.run==='blocked'&&c.blockedBy){
    var dep=item(c.blockedBy);
    h+='<div class="gate" style="border-color:var(--line-err3);background:var(--bg-err-soft3)">'+I('alert')+
      '<b style="color:var(--err)">已提出 '+esc(c.blockedBy)+' 处理</b>'+
      '<span class="small muted">'+(dep?esc(dep.t):'')+' · 状态 '+(dep?crStateText(dep.run):'—')+'</span>'+
      '<span class="spacer" style="flex:1"></span>'+
      (dep&&dep.run==='published'?('<button class="btn primary small" onclick="rerunItem(\''+c.id+'\')">依赖已发布，重新发起</button>'):'')+
      '</div>';
  }
  if(c.run==='published'){
    h+='<div class="ws clean" style="margin-top:10px"><div class="ws-h">'+I('check')+' 已发布生产 · '+esc(c.version||'')+
      (c.url?' · <span style="color:var(--info)">'+esc(c.url)+'</span>':'')+'</div></div>';
  }
  h+='</div>';
  h+=renderInterventions(c);
  return h;
}
function renderInterventions(c){
  if(!(c.interventions||[]).length) return '';
  var h='<div class="card"><div class="ch">'+I('users')+'<h3>介入记录</h3></div>';
  c.interventions.forEach(function(x){
    h+='<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line-e);font-size:11.5px">'+
      '<span class="tag t-purple" style="font-size:9px">'+esc(x.node)+'</span>'+
      '<span class="muted">'+esc(x.note)+'</span>'+
      '<span class="spacer" style="flex:1"></span>'+
      '<span class="small muted">'+esc(x.by)+' · '+esc(x.at)+'</span></div>';
  });
  return h+'</div>';
}

/* ---------- init ---------- */
initTheme();
var _snap=loadSnap();                 /* 先看本机有没有快照 */
if(!_snap) initBacklogRuns();         /* 没有才种初始执行链路，否则会盖掉上次进度 */
rt('WF','dapr sidecar ready · app-id=i3-pipeline');
rt('STATE',_snap?('statestore restored · snapshot '+String(_snapAt||'').slice(5,16).replace('T',' ')):'statestore connected · actor placement ready');
rt('PUB','pubsub connected · topic=i3.events');
refreshAll();
_snapOn=true;                         /* 首屏画完才开写入，避免把空态写回去 */
if(_snap&&_snap.cut) setTimeout(function(){toast('已恢复上次进度；'+_snap.cut+' 条执行被刷新中断，已标「已介入」，可点继续','warn');},420);
</script>
