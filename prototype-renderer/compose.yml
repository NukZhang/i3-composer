services:
  app:
    environment:
      PROTOTYPE_RENDER_SOCKET: /run/prototype-renderer/render.sock
    volumes:
      - prototype-renderer-socket:/run/prototype-renderer:ro

  prototype-renderer-init:
    image: alpine:3.24
    user: "0:0"
    command: ["chown", "65532:65532", "/run/prototype-renderer"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - prototype-renderer-socket:/run/prototype-renderer

  prototype-renderer:
    image: ${I3_PROTOTYPE_RENDERER_IMAGE:-i3-composer-prototype-renderer:local}
    build:
      # Compose 以首份配置文件所在目录为基准。使用独立工作树时可传入绝对路径。
      context: ${I3_PROTOTYPE_RENDERER_CONTEXT:-../i3-composer/prototype-renderer}
    depends_on:
      prototype-renderer-init:
        condition: service_completed_successfully
    user: "65532:65532"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    cpus: 2.0
    mem_limit: 768m
    # 同时保留四个交互会话和一个静态截图页，Chromium 的线程共用该配额。
    pids_limit: 384
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - prototype-renderer-socket:/run/prototype-renderer
    healthcheck:
      test: ["CMD", "node", "-e", "const c = require('node:net').connect('/run/prototype-renderer/render.sock'); c.once('connect', () => c.end()); c.once('error', () => process.exit(1));"]
      interval: 5s
      timeout: 2s
      retries: 4
    restart: unless-stopped

volumes:
  prototype-renderer-socket:
